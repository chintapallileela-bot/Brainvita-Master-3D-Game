<!DOCTYPE html>
<html lang="en" style="background-color: #020617; overflow: hidden; height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/LsgKttrt/Brainvita-Icon.png" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/LsgKttrt/Brainvita-Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Brainvita Master 3D: Ultimate peg solitaire puzzle." />
    
    <!-- PWA settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Brainvita Master 3D</title>
    
    <!-- Poppins Elegant Font family -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #020617;
        overflow: hidden;
        width: 100%;
      }
      
      body {
        font-family: 'Poppins', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        position: relative;
      }

      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .board-container-3d {
        perspective: 1200px;
        transform-style: preserve-3d;
      }

      .board-base {
        transform-style: preserve-3d;
        will-change: transform;
      }

      .marble-selected {
        animation: marble-hover-bob 1.2s ease-in-out infinite alternate;
      }

      @keyframes marble-hover-bob {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-8px) scale(1.06); }
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Animation for modal entrances */
      @keyframes modalIn {
        from { opacity: 0; transform: scale(0.92) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-modal {
        animation: modalIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
