<!DOCTYPE html>
<html lang="en" style="background-color: #020617;">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var SW_UPGRADE_KEY = 'brainvita_sw_upgrade_199';
          if (localStorage.getItem(SW_UPGRADE_KEY) !== 'true') {
            localStorage.setItem(SW_UPGRADE_KEY, 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                if (registrations && registrations.length > 0) {
                  var count = 0;
                  for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister().then(function() {
                      count++;
                      if (count === registrations.length) {
                        window.location.reload();
                      }
                    });
                  }
                }
              });
            }
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/LsgKttrt/Brainvita-Icon.png" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/LsgKttrt/Brainvita-Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Brainvita Master 3D: Ultimate peg solitaire puzzle." />
    
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json" />

    <title>Brainvita Master 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #020617;
        overflow: hidden;
        width: 100%;
      }
      
      body {
        font-family: 'Poppins', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        position: relative;
      }

      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020617;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.1);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .board-container-3d {
        perspective: 1500px;
        transform-style: preserve-3d;
      }

      .board-base {
        transform-style: preserve-3d;
        will-change: transform;
      }

      .btn-3d {
        position: relative;
        transition: transform 0.1s;
        transform-style: preserve-3d;
      }
      
      .btn-3d:active:not(:disabled) {
        transform: translateY(2px);
      }

      .marble-3d {
        box-shadow: 
          inset -12px -18px 30px rgba(0,0,0,0.8),
          inset 10px 10px 20px rgba(255,255,255,0.4),
          0 15px 25px -10px rgba(0,0,0,0.9);
      }
      
      .marble-selected {
        animation: marble-hover-bob 2s ease-in-out infinite alternate;
      }

      @keyframes marble-hover-bob {
        0% { transform: translateY(-40px) scale(1.1); }
        100% { transform: translateY(-50px) scale(1.15); }
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Animation for modals */
      @keyframes modalIn {
        from { opacity: 0; transform: scale(0.9) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-modal {
        animation: modalIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
      <p style="color: #475569; font-size: 11px; margin-top: 16px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;">Booting Master 3D...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
